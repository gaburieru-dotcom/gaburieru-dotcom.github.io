name: Daily Autonomous SEO Growth

on:
  schedule:
    # 毎日 日本時間 深夜2:00 (UTC 17:00) に自動実行
    - cron: '0 17 * * *'
  workflow_dispatch: # GitHub画面からの手動実行ボタン

permissions:
  contents: write
  issues: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SEO Article & Update Index
        id: generate
        run: |
          python scripts/generate_daily_article.py

      - name: Commit and Push changes
        id: git_push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "Auto-publish daily SEO article"
            git push origin main
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Notification Issue for Search Console Registration
        if: steps.git_push.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PAGE_URL: ${{ steps.generate.outputs.page_url }}
          PAGE_TITLE: ${{ steps.generate.outputs.page_title }}
        run: |
          if [ -n "$PAGE_URL" ]; then
            gh issue create \
              --title "【新着記事公開】Search Console登録用: $PAGE_TITLE" \
              --body "## 🚀 新しいSEO記事が自動公開されました！

### 📌 Google Search Console 登録用URL
**$PAGE_URL**

> **インデックス登録手順**:
> 1. 上記のURLをコピーします。
> 2. [Google Search Console](https://search.google.com/search-console) の上部検索窓（URL検査）に貼り付けます。
> 3. **「インデックス登録をリクエスト」** をクリックして完了です。

---
- **記事タイトル**: $PAGE_TITLE
- **トップページ**: https://sbmgtech.com/
"
          fi
