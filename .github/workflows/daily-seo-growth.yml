name: Daily Autonomous SEO Growth

on:
  schedule:
    # 毎日 日本時間 午前2:00 (UTC 17:00) に実行
    - cron: '0 17 * * *'
  workflow_dispatch: # GitHubのブラウザ画面から手動実行も可能

permissions:
  contents: write
  issues: write

jobs:
  auto-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate SEO Article & Update Index
        id: generate
        run: |
          python scripts/generate_daily_article.py

      - name: Commit and Push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No changes to commit."
            echo "has_changes=false" >> $GITHUB_ENV
          else
            git commit -m "Auto-publish daily SEO article: ${{ steps.generate.outputs.page_title }}"
            git push origin main
            echo "has_changes=true" >> $GITHUB_ENV
          fi

      - name: Create Notification Issue for Search Console Registration
        if: env.has_changes == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.NEW_PAGE_URL;
            const title = process.env.NEW_PAGE_TITLE;
            if (!url) return;
            
            const issueTitle = `【新着記事公開】Search Console登録用: ${title}`;
            const issueBody = `## 🚀 新しいSEO記事が自動公開されました！

### 📌 Google Search Console 登録用URL
**${url}**

> **インデックス登録手順**:
> 1. 上記のURLをコピーします。
> 2. [Google Search Console](https://search.google.com/search-console) の上部検索窓（URL検査）に貼り付けます。
> 3. **「インデックス登録をリクエスト」** をクリックして完了です。

---
- **記事タイトル**: ${title}
- **公開日時**: ${new Date().toLocaleString('ja-JP', { timeZone: 'Asia/Tokyo' })}
- **トップページ**: https://gaburieru-dotcom.github.io/
`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: issueTitle,
              body: issueBody
            });
        env:
          NEW_PAGE_URL: ${{ steps.generate.outputs.page_url }}
          NEW_PAGE_TITLE: ${{ steps.generate.outputs.page_title }}
